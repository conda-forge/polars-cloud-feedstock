context:
  name: polars-cloud
  version: 0.13.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

# Starting with 0.13.0, polars-cloud is a deprecated wrapper around polars-nanook
# that is only published as a wheel.
source:
  - url: https://pypi.org/packages/py3/p/polars-cloud/polars_cloud-${{ version }}-py3-none-any.whl
    sha256: 80fcee85ccb3572684bb694b225dd0be4534a1adf9e72d74e86993458ea69d6a
  # the wheel does not ship a license file
  - url: https://raw.githubusercontent.com/pola-rs/polars-cloud-client/client-${{ version }}/client/LICENSE
    sha256: 5cf22724ea53abcfbc2ed22b0c295672904e932427e3b2522b25e76b1baa3798
    file_name: LICENSE

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - pc=polars_nanook:cli_main
  script: python -m pip install polars_cloud-${{ version }}-py3-none-any.whl -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}
    - polars-nanook ==${{ version }}

tests:
  - python:
      imports:
        - polars_cloud
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      env:
        NANOOK_CONFIG_DIR: nanook_config
      content:
        - pc --help

about:
  homepage: https://pola.rs/nanook
  summary: "Deprecated: renamed to polars-nanook"
  description: |
    Polars Cloud is now Polars Nanook. This package installs polars-nanook plus a deprecated
    polars_cloud module that re-exports it. Switch to `import polars_nanook as pn`, the
    `nanook` CLI, and depend on polars-nanook instead.
  license: MIT
  license_file: LICENSE
  documentation: https://docs.nanook.pola.rs/
  repository: https://github.com/pola-rs/polars-cloud-client

extra:
  recipe-maintainers:
    - pavelzw
